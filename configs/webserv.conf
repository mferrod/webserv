server {
    listen 8080;
    server_name localhost;
    host 127.0.0.1;
    root ./;
    index index.html;

    # / → Solo GET
    location / {
        allowed_methods GET DELETE;
        autoindex off;
    }

    # /put_test/* → PUT (guardar archivos)
    location /put_test {
        allowed_methods PUT;
        upload_dir ./uploads;
    }

    # Archivos .bla → POST con CGI
    location ~ \.bla$ {
        allowed_methods POST;
        cgi_path /usr/bin/python3;
        cgi_ext .bla;
    }

    # /post_body → POST con límite de 100 bytes
    location /post_body {
        allowed_methods POST;
        client_max_body_size 100;
    }

    # /directory/ → GET con raíz en YoupyBanane/
    location /directory {
        root ./YoupyBanane;
        allowed_methods GET;
        index youpi.bad_extension;
        autoindex on;
    }
}
