<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebServ - En Construcción</title>
	<style>
		body {
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			font-family: Arial, sans-serif;
		}
		.container {
			text-align: center;
			background: white;
			padding: 40px;
			border-radius: 10px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
		}
		h1 {
			color: #333;
			margin: 0 0 20px 0;
		}
		p {
			color: #666;
			font-size: 18px;
		}
		.spinner {
			margin: 20px 0;
			display: inline-block;
			width: 40px;
			height: 40px;
			border: 4px solid #f3f3f3;
			border-top: 4px solid #667eea;
			border-radius: 50%;
			animation: spin 1s linear infinite;
		}
		@keyframes spin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}
	</style>
</head>
<body>
	<div class="container">
		<h1>🚀 WebServ</h1>
		<div class="spinner"></div>
		<p>Estamos trabajando en la construcción de nuestro servidor web</p>
		<p>Vuelve pronto...</p>
	</div>
</body>
</html>
